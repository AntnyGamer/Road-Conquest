name: Export GitHub Pages website

on:
  push:
    branches: [site/road-conquest-pages]
    paths:
      - "docs/**"
      - ".github/workflows/export-github-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Validate static website and AdMob record
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/privacy.html
          test -s docs/terms.html
          test -s docs/app-ads.txt
          test -s docs/favicon.svg
          test -f docs/.nojekyll
          grep -q 'Road Conquest' docs/index.html
          grep -q 'Road Conquest Privacy Policy' docs/privacy.html
          grep -q 'Terms of Service' docs/terms.html
          grep -Fxq 'google.com, pub-4489303482171969, DIRECT, f08c47fec0942fa0' docs/app-ads.txt
          grep -q 'href="./privacy.html"' docs/index.html
          grep -q 'href="./terms.html"' docs/index.html
          if grep -q 'href="https://roadconquest-api.22abongiovanni.workers.dev/\(privacy\|terms\)"' docs/index.html; then
            echo 'Legal pages should be hosted on GitHub Pages, not Cloudflare'
            exit 1
          fi
      - name: Upload root-ready GitHub Pages files
        uses: actions/upload-artifact@v4
        with:
          name: road-conquest-github-pages
          path: |
            docs/**
            docs/.nojekyll
            !docs/SITE_SETUP.md
          include-hidden-files: true
          retention-days: 30
