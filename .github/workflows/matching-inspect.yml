name: Inspect recorded driving fixtures
on:
  workflow_dispatch:
  push:
    branches: [ui-modernization-tile-milestones]
    paths:
      - .github/workflows/matching-inspect.yml
      - tools/inspect-match-replay.py
      - app/src/test/resources/matching/turn17-replay.json
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect checked-in road matching fixture offline
        run: |
          python3 -m py_compile tools/inspect-match-replay.py
          python3 tools/inspect-match-replay.py --out "$RUNNER_TEMP/matching-inspect"
      - name: Save the fixture report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matching-fixture-inspect
          path: ${{ runner.temp }}/matching-inspect
          retention-days: 14
