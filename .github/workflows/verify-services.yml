name: Verify deployed service revisions
on:
  workflow_dispatch:
    inputs:
      account_revision:
        description: Full intended account-function commit hash
        required: true
      ingress_revision:
        description: Full intended account-ingress commit hash
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Compare the public function and ingress revisions
        env:
          ACCOUNT_REVISION: ${{ inputs.account_revision }}
          INGRESS_REVISION: ${{ inputs.ingress_revision }}
        run: node server/tools/verify-deployment.mjs "$ACCOUNT_REVISION" "$INGRESS_REVISION"
