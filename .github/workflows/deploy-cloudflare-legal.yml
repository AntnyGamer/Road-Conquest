name: Deploy Road Conquest Cloudflare legal pages

on:
  push:
    branches: [main]
    paths:
      - "server/worker/**"
      - "server/tools/build-ingress.mjs"
      - "server/tools/source-revision.mjs"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/deploy-cloudflare-legal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-conquest-public-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets (repository or production environment)."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install account service build dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Test Cloudflare ingress
        run: node --test server/test/ingress.test.mjs
      - name: Bundle Cloudflare ingress
        run: npm --prefix server run build:ingress
      - name: Confirm intended public Worker target
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const c = JSON.parse(readFileSync('server/worker/wrangler-public.jsonc','utf8')); if (c.name !== 'roadconquest-api' || !c.workers_dev) throw new Error('Unexpected public Worker target')"
      - name: Deploy existing public account ingress
        run: npx --yes wrangler@4.151.1 deploy --config server/worker/wrangler-public.jsonc
      - name: Verify live public routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://roadconquest-api.22abongiovanni.workers.dev"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$base/privacy" | grep -q "Road Conquest Privacy Policy"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$base/terms" | grep -q "Terms of Service"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$base/app-ads.txt" | grep -Fxq "google.com, pub-4489303482171969, DIRECT, f08c47fec0942fa0"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$base/health/ingress" | grep -q '"ok":true'
