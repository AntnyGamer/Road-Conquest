name: Verify Cloudflare Terms links hotfix

on:
  push:
    branches:
      - site/road-conquest-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 629d4ea5da8d88c2337c85a2fa5cf29d5d12219a
      - uses: actions/checkout@v4
        with:
          ref: site/road-conquest-pages
          path: updated-site
      - name: Apply only Terms links to production-matched backend
        run: |
          cp updated-site/server/src/public-legal.mjs server/src/public-legal.mjs
          rm -rf updated-site
          if grep -q 'road-conquest-antnygamer.onrender.com' server/src/public-legal.mjs; then
            echo 'Unexpected old Render link in Terms'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Build function ZIP
        run: |
          npm --prefix server run build:function
          mkdir -p "$RUNNER_TEMP/roadconquest-function"
          cp server/dist/index.mjs "$RUNNER_TEMP/roadconquest-function/index.mjs"
          cd "$RUNNER_TEMP/roadconquest-function"
          zip -9 -q "$RUNNER_TEMP/roadconquest-function.zip" index.mjs
      - name: Smoke-test bundled public pages
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/unused
          PASSWORD_PEPPER: smoke-test-placeholder-longer-than-32-characters
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import api from './server/dist/index.mjs';
          const base = 'https://roadconquest-api.22abongiovanni.workers.dev';
          for (const [path, marker] of [['/terms','Terms of Service'], ['/app-ads.txt','pub-4489303482171969'], ['/privacy','Road Conquest Privacy Policy']]) {
            const res = await api.fetch(new Request(base + path));
            assert.equal(res.status, 200, path);
            const html = await res.text();
            assert.match(html, new RegExp(marker), path);
            if (path === '/terms') {
              assert.doesNotMatch(html, /road-conquest-antnygamer\.onrender\.com/);
              assert.match(html, /roadconquest-api\.22abongiovanni\.workers\.dev/);
            }
          }
          const ads = await api.fetch(new Request(base + '/app-ads.txt', { method:'HEAD' }));
          assert.equal(ads.status, 200);
          assert.equal(await ads.text(), '');
          NODE
      - name: Upload ready-to-deploy function
        uses: actions/upload-artifact@v4
        with:
          name: legal-pages-neon-function
          path: ${{ runner.temp }}/roadconquest-function.zip
          retention-days: 1
      - name: Export function package for authorized Neon deploy
        run: |
          echo 'RC_ZIP_B64_BEGIN'
          base64 -w 4096 "$RUNNER_TEMP/roadconquest-function.zip" | sed 's/^/RC_ZIP_B64_LINE:/'
          echo 'RC_ZIP_B64_END'
