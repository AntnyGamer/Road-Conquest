name: Published APK drive replay
on:
  push:
    branches: [perf/battery-and-rendering-review]
    paths:
      - .github/workflows/drive-replay.yml
      - tools/emulator-drive-replay.py
      - tools/fixtures/philadelphia-drive.json
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Published version without v (blank keeps the pinned Beta 20 control)'
        required: false
        type: string
        default: ''
  workflow_run:
    workflows: [Android checks]
    types: [completed]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Download and verify the exact published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          else
            # Preserve the fixed Beta20 control for review-branch comparisons.
            version="${REQUESTED_VERSION:-1.0-beta.20}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-beta(\.[0-9]+)?)?$ ]]
          tag="v$version"
          if [ "$version" = "1.0" ]; then tag="release-v$version"; fi
          target=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')
          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ] && [ "$target" != "$TESTED_COMMIT" ]; then
            echo '::notice::This source did not publish a new release; no repeated release drive is needed.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          folder="$RUNNER_TEMP/published-drive"
          mkdir -p "$folder"
          gh release download "$tag" --pattern "RoadConquest-$version.apk" --pattern "RoadConquest-$version-SHA256SUMS.txt" --dir "$folder"
          awk -v name="RoadConquest-$version.apk" '$2 == name { print }' "$folder/RoadConquest-$version-SHA256SUMS.txt" > "$folder/apk-checksum.txt"
          test -s "$folder/apk-checksum.txt"
          (cd "$folder" && sha256sum -c apk-checksum.txt)
          if [ "$GITHUB_EVENT_NAME" != 'workflow_run' ] && [ "$version" = '1.0-beta.20' ]; then
            echo "77e8aec1810cc6c6559ca0439e12598648b4af4f496544a3fd01717dad22bf02  $folder/RoadConquest-$version.apk" | sha256sum -c -
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          fi
          cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$folder/RoadConquest-$version.apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = 'cd3c4b180b4740a0bff77e37de109be6cab264cd1bd66e0ced05441252ad9ae1'
          sha256sum "$folder/RoadConquest-$version.apk" | cut -d ' ' -f 1 > "$folder/sha256.txt"
          mv "$folder/RoadConquest-$version.apk" "$folder/published.apk"
          echo "$version" > "$folder/version.txt"
          echo "$target" > "$folder/tested-source.txt"
          echo "$TESTED_COMMIT" > "$folder/harness-source.txt"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Save verified signed APK for the driving job
        if: steps.release.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-drive-apk
          path: ${{ runner.temp }}/published-drive/
          retention-days: 7
  drive:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Download the verified signed APK from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name published-drive-apk --dir "$RUNNER_TEMP/published-drive"
      - name: Update Android 37 command-line tools
        if: matrix.api == '37.0'
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;latest' > /dev/null
          install_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$install_status" -eq 0
          if [ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]; then
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator GPS client dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - name: Replay GPS through the actual release tracking service
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: ${{ matrix.api == '37.0' && '4G' || '' }}
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu lavapipe -grpc 8554
          script: python3 tools/emulator-drive-replay.py --apk "$RUNNER_TEMP/published-drive/published.apk" --expected-sha256 "$(cat "$RUNNER_TEMP/published-drive/sha256.txt")" --out "$RUNNER_TEMP/drive-evidence" --keep-location-on
      - name: Save driving data, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drive-replay-api-${{ matrix.api }}
          path: ${{ runner.temp }}/drive-evidence/
          retention-days: 14
