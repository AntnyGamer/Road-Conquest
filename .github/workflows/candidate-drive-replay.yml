name: Candidate APK drive replay
on:
  push:
    branches: [perf/battery-and-rendering-review]
    paths:
      - .github/workflows/candidate-drive-replay.yml
      - app/src/main/java/com/roadconquest/app/data/TrackingRepository.kt
      - app/src/main/java/com/roadconquest/app/matching/**
      - app/src/main/java/com/roadconquest/app/TrackingService.kt
      - tools/emulator-drive-replay.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle build state
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0'
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          fi
      - name: Build minified release and sign a disposable emulator copy
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          keytool -genkeypair -keystore "$RUNNER_TEMP/drive-test.jks" -storepass drive-test-only -keypass drive-test-only -alias drive -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI drive test'
          mkdir -p "$RUNNER_TEMP/candidate-drive"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/drive-test.jks" --ks-key-alias drive --ks-pass pass:drive-test-only --key-pass pass:drive-test-only --out "$RUNNER_TEMP/candidate-drive/candidate.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum "$RUNNER_TEMP/candidate-drive/candidate.apk" | cut -d ' ' -f 1 > "$RUNNER_TEMP/candidate-drive/sha256.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-drive/source-commit.txt"
      - name: Save candidate APK for this exact source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disposable-drive-test-apk
          path: ${{ runner.temp }}/candidate-drive/
          retention-days: 7
  drive:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out driving harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download candidate from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name disposable-drive-test-apk --dir "$RUNNER_TEMP/candidate-drive"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator GPS client dependencies
        run: python3 -m pip install grpcio==1.71.0 protobuf==6.30.2
      - name: Drive minified candidate through native Android GPS
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu lavapipe -grpc 8554
          script: python3 tools/emulator-drive-replay.py --apk "$RUNNER_TEMP/candidate-drive/candidate.apk" --expected-sha256 "$(cat "$RUNNER_TEMP/candidate-drive/sha256.txt")" --out "$RUNNER_TEMP/drive-evidence" --keep-location-on
      - name: Save candidate driving data, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-drive-api-35
          path: ${{ runner.temp }}/drive-evidence/
          retention-days: 14
