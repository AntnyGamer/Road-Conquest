name: Android checks
on:
  push:
    branches: [main, perf/battery-and-rendering-review]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  account-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://roadconquest:test-only-password@127.0.0.1:54329/roadconquest_test
      PASSWORD_PEPPER: ci-test-pepper-not-for-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify this Android build meets the server minimum version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          minimum=$(node --input-type=module -e 'import { MIN_PLAY_VERSION_CODE } from "./server/src/scoring.mjs"; console.log(MIN_PLAY_VERSION_CODE)')
          test -n "$version_code"
          if [ "$version_code" -lt "$minimum" ]; then
            echo "::error::Android versionCode $version_code is below the server minimum $minimum"
            exit 1
          fi
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # npm ci still checks the lockfile and package integrity on every run.
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Start isolated PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          # The Ubuntu runner already includes PostgreSQL binaries. Avoid both
          # Docker Hub and ECR's shared-runner download limits entirely.
          ci_pg_bin="$(pg_config --bindir)"
          ci_pg_data="$RUNNER_TEMP/roadconquest-pgdata"
          ci_pg_password="$RUNNER_TEMP/roadconquest-pg-password"
          trap 'rm -f "$ci_pg_password"' EXIT
          printf '%s\n' 'test-only-password' > "$ci_pg_password"
          chmod 600 "$ci_pg_password"
          "$ci_pg_bin/initdb" -D "$ci_pg_data" --username=roadconquest \
            --auth-local=trust --auth-host=scram-sha-256 --pwfile="$ci_pg_password" \
            --encoding=UTF8 --no-locale
          "$ci_pg_bin/pg_ctl" -D "$ci_pg_data" -l "$RUNNER_TEMP/roadconquest-postgres.log" \
            -o "-h 127.0.0.1 -p 54329 -k $ci_pg_data" -w start
          PGPASSWORD=test-only-password "$ci_pg_bin/createdb" \
            -h 127.0.0.1 -p 54329 -U roadconquest roadconquest_test
      - name: Install account server dependencies
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test account security and database constraints
        working-directory: server
        run: npm test
      - name: Save tested account function
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-function
          path: server/dist/index.mjs
          retention-days: 14
      - name: Stop isolated PostgreSQL test database
        if: always()
        shell: bash
        run: |
          ci_pg_data="$RUNNER_TEMP/roadconquest-pgdata"
          if [ -f "$ci_pg_data/postmaster.pid" ]; then
            "$(pg_config --bindir)/pg_ctl" -D "$ci_pg_data" -m fast -w stop
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify live national Census municipality boundary service
        run: python3 tools/check_us_municipality_source.py
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle build state
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            packages+=("platforms;android-37.0")
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            packages+=("build-tools;36.0.0")
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"
          fi
      - name: Verify internal competition build configuration
        run: ./gradlew :app:compileReleaseKotlin -PROADCONQUEST_LEADERBOARDS_VISIBLE=true --no-daemon --console=plain
      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon --console=plain
      - name: Verify Play deobfuscation metadata
        shell: bash
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$mapping"
          unzip -Z1 "$bundle" | grep -qx 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map'

      - name: Embed and verify complete native debug symbols
        shell: bash
        run: |
          set -euo pipefail
          maplibre_version=$(sed -n 's/.*org\.maplibre\.gl:android-sdk-opengl:\([^"]*\).*/\1/p' app/build.gradle.kts)
          if [ "$maplibre_version" != "13.7.1" ]; then
            echo "::error::Update the pinned MapLibre symbol archive/checksum for version $maplibre_version."
            exit 1
          fi
          symbols_archive="$RUNNER_TEMP/maplibre-opengl-release-symbols.tar.gz"
          symbols_url="https://github.com/maplibre/maplibre-native/releases/download/android-v13.7.1/debug-symbols-maplibre-android-opengl-release-android-v13.7.1.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 "$symbols_url" --output "$symbols_archive"
          echo "204500f02610f496e5a668489c945f4c8e0a999978d5338a3f8123ac699870f0  $symbols_archive" | sha256sum -c -

          symbols_dir="$RUNNER_TEMP/maplibre-symbols"
          rm -rf "$symbols_dir"
          mkdir -p "$symbols_dir"
          tar -xzf "$symbols_archive" -C "$symbols_dir"
          mapfile -t symbol_libs < <(find "$symbols_dir" -type f -name 'libmaplibre.so' | sort)
          if [ "${#symbol_libs[@]}" -ne 4 ]; then
            echo "::error::Expected four MapLibre ABI symbol libraries, found ${#symbol_libs[@]}."
            find "$symbols_dir" -maxdepth 4 -type f -print
            exit 1
          fi

          # Keep all four full, unstripped MapLibre symbol files embedded
          # in the Play AAB. The ABI build IDs must match the packaged native
          # libraries so Play can symbolicate native crash reports automatically.
          aab="app/build/outputs/bundle/release/app-release.aab"
          metadata_root="$RUNNER_TEMP/roadconquest-aab-metadata"
          metadata_dir="$metadata_root/BUNDLE-METADATA/com.android.tools.build.debugsymbols"
          rm -rf "$metadata_root"
          mkdir -p "$metadata_dir"
          for symbol_so in "${symbol_libs[@]}"; do
            abi=$(basename "$(dirname "$symbol_so")")
            packaged_so="$RUNNER_TEMP/roadconquest-$abi-libmaplibre.so"
            unzip -p "$aab" "base/lib/$abi/libmaplibre.so" > "$packaged_so"
            test -s "$packaged_so"
            symbol_build_id=$(readelf -n "$symbol_so" | sed -n 's/.*Build ID: //p' | head -n 1)
            packaged_build_id=$(readelf -n "$packaged_so" | sed -n 's/.*Build ID: //p' | head -n 1)
            if [ -z "$symbol_build_id" ] || [ "$symbol_build_id" != "$packaged_build_id" ]; then
              echo "::error::MapLibre symbol Build ID mismatch for $abi (symbols=$symbol_build_id packaged=$packaged_build_id)."
              exit 1
            fi
            mkdir -p "$metadata_dir/$abi"
            cp "$symbol_so" "$metadata_dir/$abi/libmaplibre.so.dbg"
          done

          # Lossless maximum ZIP deflate compression; do not strip any symbols.
          # -D avoids adding directory-only ZIP entries (not a Play requirement).
          (cd "$metadata_root" && zip -q -9 -D -r "$GITHUB_WORKSPACE/$aab" BUNDLE-METADATA)
          for symbol_so in "${symbol_libs[@]}"; do
            abi=$(basename "$(dirname "$symbol_so")")
            entry="BUNDLE-METADATA/com.android.tools.build.debugsymbols/$abi/libmaplibre.so.dbg"
            unzip -p "$aab" "$entry" | cmp - "$symbol_so" || {
              echo "::error::Missing or modified embedded full native symbols for $abi."
              exit 1
            }
          done

      - name: Validate Play bundle with embedded native symbols
        shell: bash
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output "$bundletool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum -c -
          java -jar "$bundletool" validate --bundle=app/build/outputs/bundle/release/app-release.aab

      - name: Verify Google Advertising ID permission in both release artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          permission="com.google.android.gms.permission.AD_ID"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk" > "$RUNNER_TEMP/release-apk-permissions.txt"
          if ! grep -Fq "$permission" "$RUNNER_TEMP/release-apk-permissions.txt"; then
            echo "::error::The release APK is missing $permission."
            exit 1
          fi
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          java -jar "$bundletool" dump manifest --bundle="$aab" --module=base > "$RUNNER_TEMP/release-aab-manifest.xml"
          if ! grep -Fq "$permission" "$RUNNER_TEMP/release-aab-manifest.xml"; then
            echo "::error::The Play upload AAB is missing $permission."
            exit 1
          fi

      - name: Verify 16 KB native-library compatibility
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          tmp="$RUNNER_TEMP/roadconquest-native-libs"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          if ! unzip -Z1 "$apk" 'lib/*/*.so' | grep -q .; then
            echo "::notice::No native libraries found; 16 KB ELF checks are not needed."
            exit 0
          fi
          unzip -qq "$apk" 'lib/*/*.so' -d "$tmp"

          if [ -d "$tmp/lib/armeabi-v7a" ] && [ ! -d "$tmp/lib/arm64-v8a" ]; then
            echo "::error::armeabi-v7a is packaged without the required arm64-v8a counterpart."
            exit 1
          fi
          if [ -d "$tmp/lib/x86" ] && [ ! -d "$tmp/lib/x86_64" ]; then
            echo "::error::x86 is packaged without the required x86_64 counterpart."
            exit 1
          fi

          found64=0
          while IFS= read -r -d '' so; do
            found64=1
            while read -r alignment; do
              [ -n "$alignment" ] || continue
              value=$((alignment))
              if [ "$value" -lt 16384 ]; then
                echo "::error file=$so::64-bit native LOAD segment alignment is $alignment; Google Play requires 16 KB compatibility."
                exit 1
              fi
            done < <(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$tmp/lib" -type f \( -path '*/arm64-v8a/*.so' -o -path '*/x86_64/*.so' \) -print0)
          if [ "$found64" -eq 0 ]; then
            echo "::error::Native libraries are packaged but no supported 64-bit ABI was found."
            exit 1
          fi
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - name: Mark the CI App Bundle as unsigned
        shell: bash
        run: mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/app-release-UNSIGNED-DO-NOT-UPLOAD.aab
      - name: Save tested APK for startup checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-startup-apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Save unsigned Android build inputs (not for Play upload)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-inputs-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release-UNSIGNED-DO-NOT-UPLOAD.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
  map-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 35, '37.0']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle build state
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Ensure compile SDK
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            packages+=("platforms;android-37.0")
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            packages+=("build-tools;36.0.0")
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"
          fi
      - name: Update command-line tools for Android 37.0
        if: matrix.api-level == '37.0'
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          set +o pipefail
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          install_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$install_status" -eq 0
          if [ -d "$sdk/cmdline-tools/latest-2" ]; then
            rm -rf "$sdk/cmdline-tools/latest"
            mv "$sdk/cmdline-tools/latest-2" "$sdk/cmdline-tools/latest"
          fi
          "$sdk/cmdline-tools/latest/bin/avdmanager" list device > /dev/null
      # Compile before booting the emulator. Cold dependency downloads and compilation
      # must not consume the device-test timeout or compete with Android's startup work.
      - name: Build device-test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Reclaim SDK space only when needed
        if: matrix.api-level == 31 || matrix.api-level == '37.0'
        shell: bash
        run: |
          set -euo pipefail
          # Emulator installation and userdata need far less than this safety margin.
          # Skip the expensive cleanup on modern runners that already have ample space.
          min_free_kib=$((30 * 1024 * 1024))
          free_kib=$(df -Pk "$ANDROID_HOME" | awk 'NR == 2 {print $4}')
          if [ "$free_kib" -lt "$min_free_kib" ]; then
            for sdk_platform in "$ANDROID_HOME"/platforms/*; do
              case "${sdk_platform##*/}" in
                android-37|android-37.0|android-${{ matrix.api-level }}) continue ;;
              esac
              sudo rm -rf -- "$sdk_platform"
            done
          fi
          df -h "$ANDROID_HOME"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the native map on Android ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: ${{ matrix.api-level == '37.0' && '4G' || '' }}
          emulator-boot-timeout: 300
          script: |
            adb shell settings put secure location_mode 3
            timeout --kill-after=30s 300 ./gradlew :app:connectedDebugAndroidTest --console=plain --info
      - name: Save device-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-integration-verification-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          retention-days: 14

  release-startup:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, '37.0']
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the release APK built by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-startup-apk-unsigned --dir "$RUNNER_TEMP/release-startup"
      - name: Sign a disposable copy for emulator installation
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          fi
          apk=$(find "$RUNNER_TEMP/release-startup" -name app-release-unsigned.apk -print -quit)
          test -n "$apk"
          sha256sum "$apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/startup-test.jks" -storepass startup-test-only -keypass startup-test-only -alias startup -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI startup test'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/startup-test.jks" --ks-key-alias startup --ks-pass pass:startup-test-only --key-pass pass:startup-test-only --out "$RUNNER_TEMP/startup-test.apk" "$apk"
      - name: Update Android 37 command-line tools
        if: matrix.api-level == '37.0'
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;latest' > /dev/null
          install_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$install_status" -eq 0
          if [ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]; then
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device > /dev/null
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-start the minified release on Android ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: ${{ matrix.api-level == '37.0' && '4G' || '' }}
          emulator-boot-timeout: 300
          script: bash tools/verify-release-startup.sh "$RUNNER_TEMP/startup-test.apk" "$RUNNER_TEMP/startup-results"
      - name: Save release startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-startup-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/startup-results/
          retention-days: 14

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/perf/battery-and-rendering-review')
    needs: [account-server, verify, map-integration, release-startup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21 for bundle signing
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish this version only after every required check passes
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEYSTORE: ${{ secrets.ROADCONQUEST_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_ALIAS: ${{ secrets.ROADCONQUEST_RELEASE_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ROADCONQUEST_RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ROADCONQUEST_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-beta(\.[0-9]+)?)?$ ]]
          # Scope publication from the review branch to this beta only.
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$version" != "1.0-beta.19" ]; then
            echo "::notice::This branch publishes only 1.0-beta.19."
            exit 0
          fi
          tag="v$version"
          # This publicly labeled Release 1.0 follows historical v1.0 and v1.1 builds.
          if [ "$version" = "1.0" ]; then tag="release-v$version"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_target=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')
            if [ "$existing_target" = "$GITHUB_SHA" ]; then exit 0; fi
            echo "::notice::Release $tag already points to $existing_target. Skipping publication for tested commit $GITHUB_SHA until versionName/versionCode is bumped."
            exit 0
          fi
          for secret in SIGNING_KEYSTORE SIGNING_ALIAS SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The permanent release signing secrets must be configured before publishing."
              exit 1
            fi
          done
          umask 077
          out="$RUNNER_TEMP/roadconquest-release"
          mkdir -p "$out"
          build_dir="$RUNNER_TEMP/roadconquest-build"
          gh run download "$GITHUB_RUN_ID" -n android-build-inputs-unsigned -D "$build_dir"
          mapfile -t unsigned_apks < <(find "$build_dir" -type f -name 'app-release-unsigned.apk' -print)
          mapfile -t app_bundles < <(find "$build_dir" -type f -name 'app-release-UNSIGNED-DO-NOT-UPLOAD.aab' -print)
          mapfile -t mappings < <(find "$build_dir" -type f -name 'mapping.txt' -print)
          if [ "${#unsigned_apks[@]}" -ne 1 ] || [ "${#app_bundles[@]}" -ne 1 ] || [ "${#mappings[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one verified release APK, AAB and R8 mapping artifact."
            find "$build_dir" -maxdepth 8 -type f -print
            exit 1
          fi
          cp "${unsigned_apks[0]}" "$out/RoadConquest-$version-unsigned.apk"
          cp "${app_bundles[0]}" "$out/RoadConquest-$version.aab"
          cp "${mappings[0]}" "$out/RoadConquest-$version-mapping.txt"
          git archive --format=zip --prefix="RoadConquest/" HEAD > "$out/RoadConquest-AndroidStudio-$version.zip"
          cp RELEASE_NOTES.md "$out/Release-notes.md"
          function_dir="$RUNNER_TEMP/roadconquest-account-function"
          gh run download "$GITHUB_RUN_ID" -n account-function -D "$function_dir"
          mapfile -t account_bundles < <(find "$function_dir" -type f -name 'index.mjs' -print)
          if [ "${#account_bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tested account function artifact, found ${#account_bundles[@]}."
            exit 1
          fi
          cp "${account_bundles[0]}" "$out/RoadConquest-account-function-$version.mjs"

          # ProGuard mapping and all four full MapLibre native-symbol files
          # must be embedded in the ONE Play upload AAB.
          unzip -Z1 "$out/RoadConquest-$version.aab" | grep -qx 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map'
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -Z1 "$out/RoadConquest-$version.aab" | grep -qx "BUNDLE-METADATA/com.android.tools.build.debugsymbols/$abi/libmaplibre.so.dbg"
          done

          # Sign the direct-install APK and the Play upload bundle with the permanent upload identity.
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$build_tools/apksigner" ] || [ ! -x "$build_tools/zipalign" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          fi
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/roadconquest-release.keystore"
          trap 'rm -f "$RUNNER_TEMP/roadconquest-release.keystore"' EXIT
          signer="$build_tools/apksigner"
          "$build_tools/zipalign" -c -P 16 4 "$out/RoadConquest-$version-unsigned.apk"
          "$signer" sign --ks "$RUNNER_TEMP/roadconquest-release.keystore" --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$out/RoadConquest-$version.apk" "$out/RoadConquest-$version-unsigned.apk"
          new_cert=$("$signer" verify --print-certs "$out/RoadConquest-$version.apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          test "$new_cert" = "cd3c4b180b4740a0bff77e37de109be6cab264cd1bd66e0ced05441252ad9ae1"
          jarsigner -keystore "$RUNNER_TEMP/roadconquest-release.keystore" \
            -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$out/RoadConquest-$version.aab" "$SIGNING_ALIAS"
          # Android upload keys are commonly self-signed; verify the JAR signature without
          # treating trust-chain warnings as a corrupt bundle.
          # jarsigner -verify can return exit code 0 for an *unsigned* JAR.
          # Require an actual verified signature and the pinned upload certificate.
          jarsigner -verify "$out/RoadConquest-$version.aab" | tee "$RUNNER_TEMP/roadconquest-aab-verify.txt"
          if ! grep -qx 'jar verified\.' "$RUNNER_TEMP/roadconquest-aab-verify.txt"; then
            echo "::error::The Play upload AAB is not signed and verified."
            exit 1
          fi
          bundle_cert=$(keytool -printcert -jarfile "$out/RoadConquest-$version.aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$bundle_cert" != "$new_cert" ]; then
            echo "::error::The Play upload AAB certificate does not match the permanent release upload key."
            exit 1
          fi
          # Google's bundletool checks the complete AAB structure that jarsigner
          # does not validate. Pin both the binary version and its SHA-256 digest.
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output "$bundletool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum -c -
          java -jar "$bundletool" validate --bundle="$out/RoadConquest-$version.aab"
          rm "$out/RoadConquest-$version-unsigned.apk"
          (cd "$out" && sha256sum *.apk *.aab *.zip *.mjs *-mapping.txt > "RoadConquest-$version-SHA256SUMS.txt")
          release_flags=()
          if [[ "$version" == *-beta* ]]; then release_flags+=(--prerelease); fi
          release_title="${version/-beta./ Beta }"
          release_title="${release_title/-beta/ Beta}"
          if [ "$version" = "1.0" ]; then release_title="Release $release_title"; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Road Conquest $release_title" "${release_flags[@]}" \
            --notes-file "$out/Release-notes.md" "$out"/*.apk "$out"/*.aab "$out"/*.zip "$out"/*.mjs "$out"/*-mapping.txt "$out"/*SHA256SUMS.txt
